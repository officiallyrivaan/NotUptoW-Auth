<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — NotUpto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --bg2: #111111; --bg3: #181818; --surface: #1e1e1e;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0ede8; --muted: #888880; --faint: #444440;
    --red: #e85d3a; --red-bg: rgba(232,93,58,0.1); --red-border: rgba(232,93,58,0.25);
    --green: #4caf7d; --green-bg: rgba(76,175,125,0.1); --green-border: rgba(76,175,125,0.25);
    --font-display: 'Outfit', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 10px; --radius-lg: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-body); min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 2rem 1rem;
  }
  body::before {
    content: ''; position: fixed;
    top: -200px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 500px;
    background: radial-gradient(ellipse, rgba(232,93,58,0.07) 0%, transparent 65%);
    pointer-events: none;
  }
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    background: rgba(10,10,10,0.85); backdrop-filter: blur(16px);
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; padding: 0 2rem;
  }
  .logo { font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; color: var(--text); text-decoration: none; }
  .logo span { color: var(--red); }

  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 2.5rem 2rem;
    animation: fadeUp 0.4s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .auth-eyebrow { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.14em; color: var(--red); text-transform: uppercase; margin-bottom: 0.6rem; }
  .auth-title { font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.3rem; }
  .auth-sub { font-size: 0.83rem; color: var(--muted); font-weight: 300; margin-bottom: 2rem; }

  .form-group { margin-bottom: 1.1rem; }
  .form-label { display: block; font-size: 0.75rem; font-family: var(--font-mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.45rem; }
  .form-input {
    width: 100%; background: var(--bg3);
    border: 0.5px solid var(--border); border-radius: var(--radius);
    padding: 0.75rem 1rem; color: var(--text);
    font-family: var(--font-body); font-size: 0.9rem;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--border2); }
  .form-input.error { border-color: var(--red); }
  .form-input.valid { border-color: var(--green); }
  .form-input::placeholder { color: var(--faint); }

  .field-hint { font-size: 0.7rem; color: var(--faint); font-family: var(--font-mono); margin-top: 0.35rem; }

  /* Password strength bar */
  .strength-wrap { margin-top: 0.4rem; }
  .strength-bar { height: 3px; background: var(--surface); border-radius: 2px; overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
  .strength-label { font-size: 0.65rem; font-family: var(--font-mono); color: var(--faint); margin-top: 0.2rem; }

  .error-msg { display: none; background: var(--red-bg); border: 0.5px solid var(--red-border); border-radius: var(--radius); padding: 0.65rem 0.9rem; font-size: 0.8rem; color: var(--red); font-family: var(--font-mono); margin-bottom: 1.25rem; line-height: 1.5; }
  .error-msg.show { display: block; }
  .success-msg { display: none; background: var(--green-bg); border: 0.5px solid var(--green-border); border-radius: var(--radius); padding: 0.65rem 0.9rem; font-size: 0.8rem; color: var(--green); font-family: var(--font-mono); margin-bottom: 1.25rem; }
  .success-msg.show { display: block; }

  .submit-btn {
    width: 100%; background: var(--red); color: #fff;
    border: none; border-radius: var(--radius); padding: 0.85rem 1.5rem;
    font-size: 0.9rem; font-weight: 500; font-family: var(--font-body);
    cursor: pointer; transition: opacity 0.2s, transform 0.15s; margin-top: 0.5rem;
  }
  .submit-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .auth-footer { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 0.5px solid var(--border); text-align: center; font-size: 0.82rem; color: var(--muted); }
  .auth-footer a { color: var(--red); text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
  .auth-footer a:hover { opacity: 0.8; }

  .spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Username availability indicator */
  .username-status { font-size: 0.7rem; font-family: var(--font-mono); margin-top: 0.3rem; min-height: 1rem; }
  .username-status.checking { color: var(--faint); }
  .username-status.available { color: var(--green); }
  .username-status.taken { color: var(--red); }

  @media (max-width: 480px) { .auth-card { padding: 2rem 1.25rem; } }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="/" class="logo">Not<span>Upto</span></a>
</nav>

<div class="auth-card">
  <div class="auth-eyebrow">Join NotUpto</div>
  <h1 class="auth-title">Create account</h1>
  <p class="auth-sub">No email needed. Just a username and password.</p>

  <div class="error-msg" id="error-msg"></div>
  <div class="success-msg" id="success-msg"></div>

  <form id="signup-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input
        class="form-input"
        type="text"
        id="username"
        name="username"
        autocomplete="username"
        placeholder="choose_a_username"
        spellcheck="false"
        autocapitalize="none"
        maxlength="30"
        required
      >
      <div class="field-hint">3–30 characters. Letters, numbers, _ and - only.</div>
      <div class="username-status" id="username-status"></div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input
        class="form-input"
        type="password"
        id="password"
        name="password"
        autocomplete="new-password"
        placeholder="Min. 8 characters"
        required
      >
      <div class="strength-wrap">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-label" id="strength-label"></div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm-password">Confirm Password</label>
      <input
        class="form-input"
        type="password"
        id="confirm-password"
        name="confirm-password"
        autocomplete="new-password"
        placeholder="Re-enter your password"
        required
      >
    </div>

    <button class="submit-btn" type="submit" id="submit-btn">
      <span class="spinner" id="spinner"></span>
      Create account
    </button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="/login.html">Log in</a>
  </div>
</div>

<script>
  var form         = document.getElementById('signup-form');
  var errorMsg     = document.getElementById('error-msg');
  var successMsg   = document.getElementById('success-msg');
  var submitBtn    = document.getElementById('submit-btn');
  var spinner      = document.getElementById('spinner');
  var usernameInput = document.getElementById('username');
  var passwordInput = document.getElementById('password');
  var confirmInput  = document.getElementById('confirm-password');
  var usernameStatus = document.getElementById('username-status');
  var strengthFill   = document.getElementById('strength-fill');
  var strengthLabel  = document.getElementById('strength-label');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    successMsg.classList.remove('show');
  }
  function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.classList.add('show');
    errorMsg.classList.remove('show');
  }
  function clearMessages() {
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
    document.querySelectorAll('.form-input').forEach(function(el) {
      el.classList.remove('error', 'valid');
    });
  }
  function setLoading(loading) {
    submitBtn.disabled = loading;
    spinner.classList.toggle('show', loading);
    if (!loading) {
      submitBtn.textContent = 'Create account';
      submitBtn.prepend(spinner);
    }
  }

  // ── Password strength indicator ──────────────────────────────────────────
  function getStrength(pwd) {
    if (!pwd) return { score: 0, label: '', color: '' };
    var score = 0;
    if (pwd.length >= 8)  score++;
    if (pwd.length >= 12) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    var levels = [
      { label: '',         color: '',                   pct: '0%'  },
      { label: 'Weak',     color: 'var(--red)',          pct: '25%' },
      { label: 'Fair',     color: 'var(--amber)',        pct: '50%' },
      { label: 'Good',     color: 'var(--amber)',        pct: '70%' },
      { label: 'Strong',   color: 'var(--green)',        pct: '85%' },
      { label: 'Very strong', color: 'var(--green)',    pct: '100%'}
    ];
    return levels[Math.min(score, 5)];
  }

  passwordInput.addEventListener('input', function() {
    var s = getStrength(this.value);
    strengthFill.style.width    = s.pct;
    strengthFill.style.background = s.color;
    strengthLabel.textContent   = s.label;
    strengthLabel.style.color   = s.color || 'var(--faint)';
  });

  // ── Live username availability check (debounced) ─────────────────────────
  var usernameTimer = null;
  usernameInput.addEventListener('input', function() {
    var val = this.value.trim();
    usernameStatus.textContent = '';
    usernameStatus.className = 'username-status';
    clearTimeout(usernameTimer);

    if (val.length < 3) return;
    if (!/^[a-zA-Z0-9_-]+$/.test(val)) {
      usernameStatus.textContent = 'Invalid characters.';
      usernameStatus.className = 'username-status taken';
      return;
    }

    usernameStatus.textContent = 'Checking...';
    usernameStatus.className = 'username-status checking';

    usernameTimer = setTimeout(async function() {
      try {
        // We call /api/signup with a dummy password just to check availability
        // In a real app you'd have a dedicated /api/check-username endpoint
        // For now we check on submit — this is just a UX hint, not authoritative
        usernameStatus.textContent = '';
        usernameStatus.className = 'username-status';
      } catch {}
    }, 500);
  });

  // ── Form submit ─────────────────────────────────────────────────────────
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    clearMessages();

    var username = usernameInput.value.trim();
    var password = passwordInput.value;
    var confirm  = confirmInput.value;

    // Client-side validation
    if (!username) {
      usernameInput.classList.add('error');
      return showError('Please choose a username.');
    }
    if (username.length < 3) {
      usernameInput.classList.add('error');
      return showError('Username must be at least 3 characters.');
    }
    if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
      usernameInput.classList.add('error');
      return showError('Username can only contain letters, numbers, _ and -.');
    }
    if (!password || password.length < 8) {
      passwordInput.classList.add('error');
      return showError('Password must be at least 8 characters.');
    }
    if (password !== confirm) {
      confirmInput.classList.add('error');
      return showError('Passwords do not match.');
    }

    setLoading(true);

    try {
      var res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username: username, password: password })
      });

      var data = await res.json();

      if (!res.ok) {
        setLoading(false);
        // Highlight username field for "taken" errors
        if (res.status === 409) usernameInput.classList.add('error');
        return showError(data.error || 'Signup failed. Please try again.');
      }

      // Success
      showSuccess('Account created! Redirecting...');
      localStorage.setItem('notupto_user', JSON.stringify(data.user));

      setTimeout(function() {
        window.location.href = '/';
      }, 800);

    } catch (err) {
      setLoading(false);
      showError('Network error. Please check your connection and try again.');
    }
  });

  // If already logged in, redirect home
  (async function checkSession() {
    try {
      var res = await fetch('/api/me', { credentials: 'include' });
      if (res.ok) window.location.href = '/';
    } catch {}
  })();
</script>
</body>
</html>
