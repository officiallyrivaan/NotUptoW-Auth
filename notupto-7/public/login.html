<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — NotUpto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --bg2: #111111; --bg3: #181818; --surface: #1e1e1e;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0ede8; --muted: #888880; --faint: #444440;
    --red: #e85d3a; --red-bg: rgba(232,93,58,0.1); --red-border: rgba(232,93,58,0.25);
    --green: #4caf7d; --green-bg: rgba(76,175,125,0.1); --green-border: rgba(76,175,125,0.25);
    --font-display: 'Outfit', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 10px; --radius-lg: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 500px;
    background: radial-gradient(ellipse, rgba(232,93,58,0.07) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Nav strip */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; padding: 0 2rem;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 1.15rem; font-weight: 800;
    color: var(--text); text-decoration: none;
  }
  .logo span { color: var(--red); }

  /* Card */
  .auth-card {
    width: 100%; max-width: 400px;
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem 2rem;
    animation: fadeUp 0.4s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.65rem; letter-spacing: 0.14em;
    color: var(--red); text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  .auth-title {
    font-family: var(--font-display);
    font-size: 1.75rem; font-weight: 800;
    letter-spacing: -0.03em; margin-bottom: 0.3rem;
  }
  .auth-sub {
    font-size: 0.83rem; color: var(--muted);
    font-weight: 300; margin-bottom: 2rem;
  }

  /* Form */
  .form-group { margin-bottom: 1.1rem; }
  .form-label {
    display: block;
    font-size: 0.75rem; font-family: var(--font-mono);
    color: var(--muted); letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.45rem;
  }
  .form-input {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: var(--font-body); font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--border2); }
  .form-input.error { border-color: var(--red); }
  .form-input::placeholder { color: var(--faint); }

  /* Error message */
  .error-msg {
    display: none;
    background: var(--red-bg);
    border: 0.5px solid var(--red-border);
    border-radius: var(--radius);
    padding: 0.65rem 0.9rem;
    font-size: 0.8rem; color: var(--red);
    font-family: var(--font-mono);
    margin-bottom: 1.25rem;
    line-height: 1.5;
  }
  .error-msg.show { display: block; }

  /* Success message */
  .success-msg {
    display: none;
    background: var(--green-bg);
    border: 0.5px solid var(--green-border);
    border-radius: var(--radius);
    padding: 0.65rem 0.9rem;
    font-size: 0.8rem; color: var(--green);
    font-family: var(--font-mono);
    margin-bottom: 1.25rem;
  }
  .success-msg.show { display: block; }

  /* Submit button */
  .submit-btn {
    width: 100%;
    background: var(--red); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 0.85rem 1.5rem;
    font-size: 0.9rem; font-weight: 500;
    font-family: var(--font-body); cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    margin-top: 0.5rem;
  }
  .submit-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Divider + switch link */
  .auth-footer {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 0.5px solid var(--border);
    text-align: center;
    font-size: 0.82rem; color: var(--muted);
  }
  .auth-footer a {
    color: var(--red); text-decoration: none;
    font-weight: 500; transition: opacity 0.2s;
  }
  .auth-footer a:hover { opacity: 0.8; }

  /* Loading spinner inside button */
  .spinner {
    display: none;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 0.5rem;
    vertical-align: middle;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .auth-card { padding: 2rem 1.25rem; }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="/" class="logo">Not<span>Upto</span></a>
</nav>

<div class="auth-card">
  <div class="auth-eyebrow">Welcome back</div>
  <h1 class="auth-title">Log in</h1>
  <p class="auth-sub">Enter your username and password to continue.</p>

  <div class="error-msg" id="error-msg"></div>
  <div class="success-msg" id="success-msg"></div>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input
        class="form-input"
        type="text"
        id="username"
        name="username"
        autocomplete="username"
        placeholder="your_username"
        spellcheck="false"
        autocapitalize="none"
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input
        class="form-input"
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        placeholder="••••••••"
        required
      >
    </div>

    <button class="submit-btn" type="submit" id="submit-btn">
      <span class="spinner" id="spinner"></span>
      Log in
    </button>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="/signup.html">Sign up</a>
  </div>
</div>

<script>
  var form      = document.getElementById('login-form');
  var errorMsg  = document.getElementById('error-msg');
  var successMsg = document.getElementById('success-msg');
  var submitBtn = document.getElementById('submit-btn');
  var spinner   = document.getElementById('spinner');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    successMsg.classList.remove('show');
  }

  function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.classList.add('show');
    errorMsg.classList.remove('show');
  }

  function clearMessages() {
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
    document.querySelectorAll('.form-input').forEach(function(el) {
      el.classList.remove('error');
    });
  }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    spinner.classList.toggle('show', loading);
    submitBtn.textContent = loading ? '' : 'Log in';
    if (loading) submitBtn.prepend(spinner);
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    clearMessages();

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    // Basic client-side validation
    if (!username) {
      document.getElementById('username').classList.add('error');
      return showError('Please enter your username.');
    }
    if (!password) {
      document.getElementById('password').classList.add('error');
      return showError('Please enter your password.');
    }

    setLoading(true);

    try {
      var res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include', // Send/receive cookies
        body: JSON.stringify({ username: username, password: password })
      });

      var data = await res.json();

      if (!res.ok) {
        setLoading(false);
        return showError(data.error || 'Login failed. Please try again.');
      }

      // Success — store username for nav display, then redirect
      showSuccess('Logged in! Redirecting...');
      localStorage.setItem('notupto_user', JSON.stringify(data.user));

      setTimeout(function() {
        // Redirect to the page they came from, or home
        var returnTo = sessionStorage.getItem('returnTo') || '/';
        sessionStorage.removeItem('returnTo');
        window.location.href = returnTo;
      }, 800);

    } catch (err) {
      setLoading(false);
      showError('Network error. Please check your connection and try again.');
    }
  });

  // If already logged in, redirect home
  (async function checkSession() {
    try {
      var res = await fetch('/api/me', { credentials: 'include' });
      if (res.ok) window.location.href = '/';
    } catch {}
  })();
</script>
</body>
</html>
